services:
  - type: web
    name: star-moon-compatibility
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn public_app:application --bind 0.0.0.0:$PORT --workers 2 --timeout 30
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
