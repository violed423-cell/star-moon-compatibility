name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python test_public_app.py
      - run: python test_calendar_engine.py
      - run: python compatibility_v1_6.py
      - run: python love_type_16_v1_4.py
      - run: python test_星月自動相性診断_v1_6.py
      - run: python test_release_review.py
      - run: python -m compileall -q .

      - run: python test_source_offer.py
      - run: python test_preview.py
